repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black --config studyoverflow/pyproject.toml
        language: system
        types: [python]
        pass_filenames: true

      - id: isort
        name: isort
        entry: isort --settings-path studyoverflow/pyproject.toml
        exclude: |
          (?x)(
              \.venv/|
              __pycache__/|
              \.idea/|
              manage\.py|
              migrations/
          )
        language: system
        types: [python]
        pass_filenames: true

      - id: flake8
        name: flake8
        entry: flake8 --config studyoverflow/.flake8
        exclude: |
          (?x)(
              \.venv/|
              __pycache__/|
              \.idea/|
              manage\.py|
              migrations/|
              studyoverflow/studyoverflow/
          )
        language: system
        types: [python]
        pass_filenames: true

      - id: mypy
        name: mypy
        entry: mypy --config-file studyoverflow/pyproject.toml
        exclude: |
          (?x)(
              \.venv/|
              __pycache__/|
              \.idea/|
              manage\.py|
              migrations/
          )
        language: system
        types: [python]
        pass_filenames: true

      - id: django-tests
        name: Django tests
        # Указывается e2e вместо studyoverflow/e2e, так как rootdir меняется на studyoverflow,
        # где лежит pytest.ini
        entry: pytest -n 0 -c studyoverflow/pytest.ini --ignore=e2e
        language: system
        types: [python]
        files: ^studyoverflow/
        pass_filenames: false