{# Сетка пользователей #}
<div class="row g-5 users-grid mb-5">

  {% for user in users %}
    {% include 'users/_user_card.html' %}
  {% empty %}
    <div class="text-center text-secondary py-4">
      Пользователи не найдены
    </div>
  {% endfor %}

</div>

<div id="load-more-container">
  {% if remaining %}
  <div class="text-center" id="users-load-buttons">
      <button
          class="btn btn-warning-custom text-warning load-more-btn"
          hx-get="{% url 'users:list_htmx' %}"
          hx-target="#load-more-container"
          hx-swap="outerHTML"
          hx-vals='{
              "offset": "{{ offset|add:limit }}",
              "limit": "{{ limit }}",
              "online": "{{ request.GET.online|default:"any" }}",
              "user_sort": "{{ request.GET.user_sort|default:"reputation" }}",
              "user_order": "{{ request.GET.user_order|default:"desc" }}"
          }'
          hx-indicator="#users-load-indicator, #users-load-buttons">
            Загрузить ещё
      </button>

      <button
          class="btn btn-warning-custom text-warning load-more-btn"
          hx-get="{% url 'users:list_htmx' %}"
          hx-target="#load-more-container"
          hx-swap="outerHTML"
          hx-vals='{
              "offset": "{{ offset|add:limit }}",
              "limit": -1,
              "online": "{{ request.GET.online|default:"any" }}",
              "user_sort": "{{ request.GET.user_sort|default:"reputation" }}",
              "user_order": "{{ request.GET.user_order|default:"desc" }}"
          }'
          hx-indicator="#users-load-indicator, #users-load-buttons">
            Загрузить всех
      </button>
  </div>

  {# Индикатор загрузки #}
  <div id="users-load-indicator" class="htmx-indicator py-3">
    <div class="d-flex align-items-center justify-content-center gap-2">
      <div class="spinner-border text-light" role="status" style="width: 1.2rem; height: 1.2rem;"></div>
      <span class="text-white" style="font-size: 1.05rem">Загрузка пользователей...</span>
    </div>
  </div>
  {% endif %}
</div>
