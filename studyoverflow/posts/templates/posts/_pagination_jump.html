{# Кнопка "..." по клику становится полем ввода номера страницы #}
<li class="page-item page-jump">
  <button type="button" class="page-link page-jump-toggle">...</button>
  <input type="text"
         inputmode="numeric"
         pattern="[0-9]*"
         class="form-control page-jump-input"
         size="2"
         maxlength="{{ page_obj.paginator.num_pages|stringformat:'s'|length }}"
         placeholder="..."
         data-base-url="?{{ querystring }}&page="
         data-max-page="{{ page_obj.paginator.num_pages }}">
</li>
