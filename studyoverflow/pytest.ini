[pytest]
# Имя файла с настройками проекта для тестирования
DJANGO_SETTINGS_MODULE = studyoverflow.settings.test

python_files = tests.py test_*.py *_tests.py

# Дефолтные аргументы запуска, не нужно прописывать при запуске тестов
# --nomigrations - создавать базу по моделям, не запуская миграции,
#   сейчас не используется с целью проверки корректности и актуальности миграций
# --reuse-db - не удалять тестовую БД после тестов (повторные тесты будут быстрее),
#   при появлении новых миграций нужно использовать флаг --create-db для обновления структуры тестовой БД
# --timeout - остановка и падение теста, если он превысил время выполнения,
#   вместе с "--create-db" использовать флаг нельзя, иначе миграции могут не успеть примениться
#   и тогда тесты упадут на этапе пересоздания БД (если не задан параметр timeout_func_only = true)
# --strict-markers - нельзя использовать незарегистрированные маркеры,
#   чтобы не пропускались опечатки в именах маркеров при запуске тестов
# -v - подробный формат результатов тестов
# -n 4 - запускать тесты параллельно в 4 процессах (через pytest-xdist)
addopts = --reuse-db --timeout=10 --strict-markers -v -n 4

# При этом pytest --create-db --timeout=0 --strict-markers -v -n 4,
# то есть использовать --timeout вместе с --create-db нельзя (без параметра timeout_func_only = true)!

# Таймаут считается только на тело теста, таймаут не распространяется на setup и teardown фикстур.
# Без этого параметра при первом прогоне тестов с таймаутами они могут упасть по нему из-за подготовки БД,
# таймаут срабатывает на создании БД и применении миграций в session-фикстуре (scope - session),
# принудительно останавливает воркер xdist и тесты падают.
timeout_func_only = true

# Отключение экранирования не-ASCII символов
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

# Регистрация маркеров тестов
markers =
    # Использовать: @pytest.mark.slow,
    # запуски:
    #   pytest -m "not slow"
    #   pytest -m slow
    # В текущей версии проекта не используется
    slow: long-running tests

# Превращает Warnings в Exceptions, тесты упадут, если есть Warnings
filterwarnings =
    error
