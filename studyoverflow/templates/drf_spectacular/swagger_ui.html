{% extends "navigation/base.html" %}

{% block title %}
  <title>{{ title|default:"Swagger" }}</title>
{% endblock %}

{% block extra_css %}
  {% if favicon_href %}<link rel="icon" href="{{ favicon_href }}">{% endif %}
  <link rel="stylesheet" href="{{ swagger_ui_css }}">

  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *:after, *:before { box-sizing: inherit; }

    body {
        background-color: #ffffff !important;
    }

    #header {
        background-color: #000000 !important;
        border-bottom: 1px solid darkgray;
    }

    #footer {
      border-top: none;
    }

    .swagger-ui {
        background: #fafafa;
    }

    .swagger-ui .info .title {
      color: #3b4151 !important;
      font-family: sans-serif !important;
      font-size: 36px !important;
      margin: 0 !important;
      font-weight: bold !important;
    }

    h3, h4 {
        font-weight: bold !important;
    }

    code {
      color: #3b4151;;
    }
  </style>
{% endblock %}

{% block content %}
  <div id="swagger-ui"></div>
{% endblock %}

{% block extra_js %}
  <!-- Оригинальные JS-файлы Swagger -->
  <script src="{{ swagger_ui_bundle }}"></script>
  <script src="{{ swagger_ui_standalone }}"></script>

  {% if script_url %}
    <script src="{{ script_url }}"></script>
  {% else %}
    <script>
      {% include template_name_js %}
    </script>
  {% endif %}
{% endblock %}
