{% extends "navigation/base.html" %}

{% block title %}
  <title>{{ title|default:"Swagger" }}</title>
{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ swagger_ui_css }}">

  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *:after, *:before { box-sizing: inherit; }

    body {
        background-color: #ffffff !important;
    }

    #header {
        background-color: #000000 !important;
        border-bottom: 1px solid darkgray;
    }

    .swagger-ui {
        background: #fafafa;
    }

    .swagger-ui .info .title {
      color: #3b4151 !important;
      font-family: sans-serif !important;
      font-size: 36px !important;
      margin: 0 !important;
      font-weight: bold !important;
    }

    h3, h4 {
        font-weight: bold !important;
    }

    code {
      color: #3b4151;
    }
  </style>
{% endblock %}

{% block content %}
  <div id="swagger-ui"></div>
{% endblock %}

{% block extra_js %}
  <!-- Оригинальные JS-файлы Swagger -->
  <script src="{{ swagger_ui_bundle }}"></script>
  <script src="{{ swagger_ui_standalone }}"></script>

  {% if script_url %}
    <script src="{{ script_url }}"></script>
  {% else %}
    <script>
      {% include template_name_js %}
    </script>
  {% endif %}

  <script>
    // Ручной скролл к операции по хэшу: #swagger-ui рендерится асинхронно, браузер не успевает проскроллить сам при загрузке страницы
    (function () {
      if (!window.location.hash) return;

      // отрезается "#" и выполняется декодирование, получается хеш "/auth/auth_drf_token_login_create"
      var rawHash = decodeURIComponent(window.location.hash.slice(1));
      // строка приводится к формату id операции в DOM: "operations-auth-auth_drf_token_login_create"
      var targetId = 'operations' + rawHash.replace(/\//g, '-');
      // получение контейнера, куда рендерится список операций
      var container = document.getElementById('swagger-ui');

      // скролл
      function tryScroll() {
        // поиск элемента операции по вычисленному id
        var target = document.getElementById(targetId);
        if (target) {
          // если элемент найден — выполняется скролл к нему
          target.scrollIntoView({ block: 'start' });
          return true;
        }
        return false;
      }

      if (tryScroll()) return;

      // отслеживание появления новых элементов внутри контейнера
      var observer = new MutationObserver(function () {
        // как только элемент найден и скролл выполнен — наблюдение отключается
        if (tryScroll()) observer.disconnect();
      });
      observer.observe(container, { childList: true, subtree: true });

      setTimeout(function () { observer.disconnect(); }, 15000);
    })();
  </script>
{% endblock %}
