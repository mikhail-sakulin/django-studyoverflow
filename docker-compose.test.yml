# Используется для запуска тестов локально при разработке и для CI проверок.
#
# Команды запуска, например:
#   - запуск тестов:
#       docker compose -p studyoverflow-test -f docker-compose.test.yml --env-file .env.test run --rm studyoverflow-tests
#
#   - запуск проверки black, для isort, flake8 и mypy аналогично (команды есть в ci.yml):
#       docker compose -p studyoverflow-test -f docker-compose.test.yml --env-file .env.test run --rm studyoverflow-tests black --config pyproject.toml --check .
#
#   - остановка и удаление контейнеров (например postgres, который остается незавершенным):
#       docker compose -p studyoverflow-test -f docker-compose.test.yml --env-file .env.test down -v

services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - .env.test
    restart: "no"
    networks:
      - studyoverflow_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 5s
      timeout: 5s
      retries: 5

  studyoverflow-tests:
    build:
      context: ./studyoverflow
      dockerfile: Dockerfile
      target: dev-image
    image: ${STUDYOVERFLOW_IMAGE}:${IMAGE_TAG_CI:-dev}
    env_file:
      - .env.test
    command: pytest
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
    networks:
      - studyoverflow_network
    expose:
      - "8000"
    volumes:
      - ./studyoverflow:/app/studyoverflow
    # Нужно для дебага python контейнера в PyCharm (в /etc/hosts контейнера
    # прописывается, что host.docker.internal — это IP-адрес хоста, например 172.18.0.1 host.docker.internal,
    # host-gateway заменяется на IP хоста в локальной сети Docker)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  studyoverflow_network:
    driver: bridge
