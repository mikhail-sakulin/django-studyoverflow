# map - аналог if/else,
# создается переменная $connection_upgrade, значение которой динамически зависит от входящего заголовка $http_upgrade
# 1) Если клиент пришел с обычным протоколом http/https (заголовка Upgrade нет - он задается Nginx пустой строкой ("")), то $connection_upgrade
# принимает значение close (нет смены протокола),
# 2) Если клиент хочет установить WebSocket-соединение, то заголовок Upgrade: websocket,
# Nginx сопоставляет это со значением по умолчанию (default, других совпадений нет) и записывает в переменную $connection_upgrade значение upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Ограничение частоты HTTP-запросов с одного IP-адреса для Django
# - Директива limit_req_zone создаёт в ОП зону, где Nginx будет сохранять заполненность "вытекающего ведра" для
#   каждого IP-адреса, сама директива не ограничивает число запросов, а только создает правило и зону.
# - $binary_remote_addr - ключ, по которому Nginx различает клиентов, это IP-адрес в бинарном виде,
#   бинарный вид экономит память.
# - zone=requests_per_ip:10m - создает общую зону в ОП с названием requests_per_ip размером 10 Мб (около 80_000 IP),
#   задает имя и размер по памяти для зоны для директивы limit_req_zone.
# - rate=10r/s - задает ограничение запросов через скорость: 1 запрос в 100 мс на каждый IP. Используется
#   алгоритм "вытекающего ведра". Запросы сверх этой скорости (более 1 запроса за 100 мс) попадают в "ведро",
#   которое освобождается с такой же скоростью (1 место в 100 мс). Ведро задается параметром burst.
#   - Параметр burst (всплеск) в директиве limit_req внутри location задает размер "ведра" - сколько запросов выше
#     нормы (1 в 100 мс) можно принять разом. Запросы, не поместившиеся в ведро, получают 503 ответ (429
#     если стоит limit_req_status 429;).
#   - burst=... nodelay, nodelay запросы помещаются в "ведро" и обрабатываются сразу, без ожидания. По умолчанию
#   задано delay=0 - то есть все запросы из "ведра" будут ждать своей очереди (1 запрос в 100 мс).
#   Delay задаёт порог, после которого избыточные запросы начинают задерживаться. При nodelay запросы в "ведре"
#   обрабатываются сразу, но место освобождается с той же скоростью.
#   - При rate=10r/s без burst строго 1 запрос в 100 мс, нет "вытекающего ведра" (burst=0).
#   - С burst=10 без nodelay за 1 секунду допускается 11 одновременных запросов, 1 обработается сразу, другие
#     10 будут обрабатываться по очереди (1 в 100 мс).
#   - С burst=10 nodelay за 1 секунду допускается 21 запрос за секунду с всплеском в 11 в начале (обработаются
#     сразу 11, но 10 мест будет занято в "ведре"), затем 10 в секунду (1 в 100 мс) стабильно.
limit_req_zone $binary_remote_addr zone=requests_per_ip_django:10m rate=10r/s;
# Мягкое глобальное ограничение частоты запросов для всех location, кроме / (Django, за исключением WebSocket)
limit_req_zone $binary_remote_addr zone=requests_per_ip_global:10m rate=50r/s;
# Меняет ответ Nginx при превышении лимита запросов с 503 Service Unavailable на 429 Too Many Requests
limit_req_status 429;

# Ограничение числа одновременных соединений с одного IP-адреса
# - limit_conn_zone создаёт зону в ОП, где Nginx хранит число активных соединений каждого IP-адреса,
#   сама директива соединения не ограничивает, а только создаёт зону.
# - $binary_remote_addr - ключ, по которому различаются клиенты, IP в бинарном виде.
# - zone=connections_per_ip:10m - имя зоны в ОП и её размер, 10 Мб.
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
# При превышении лимита соединений вместо 503 отвечать 429
limit_conn_status 429;

# Группа контейнеров для балансировки запросов между ними
upstream studyoverflow_backend {
    # ip_hash; при разработке и использовании Django Debug ToolBar,
    # ip_hash — закрепляет пользователя за конкретным сервером по IP
    # least_conn; для продакшена, следующий запрос тому, у кого меньше активных соединений
    least_conn;

    server studyoverflow-1:8000;
    server studyoverflow-2:8000;

    # Постоянное TCP соединение между между Nginx и бекендом (studyoverflow)
    # 32 - максимальное количество заранее открытых соединений с бекендом (общее число на группу), пул соединений
    keepalive 32;
}

server {
    # Порт, который слушает Nginx на всех доступных сетевых интерфейсах (и всех IP, listen 0.0.0.0:80;)
    listen 80;
    # Добавляет кодировку в HTTP-заголовок ответа Content-Type для браузера
    charset utf-8;
    # Список доменов (HTTP-заголовок Host), для которых Nginx будет обрабатывать запросы в этом блоке (server)
    server_name localhost studyoverflow.ru www.studyoverflow.ru;

    # Мягкое глобальное ограничение частоты запросов для всех location: всплеск до 100 запросов, без задержек.
    # В location / (Django, за исключением WebSocket) задано свое, более строго ограничение.
    limit_req zone=requests_per_ip_global burst=100 nodelay;
    # Не более 30 одновременных соединений с одного IP-адреса, действует на все location
    limit_conn connections_per_ip 30;

    # Максимальный размер загружаемых файлов
    client_max_body_size 20M;

    # Настройка сжатия Gzip для экономии сетевого трафика и увеличения скорости передачи данных
    gzip on;
    # Типы сжтимаемых данных
    gzip_types text/plain text/css application/json application/javascript text/xml;
    # Файлы меньше 1 КБ не сжимаются (их сжимать невыгодно)
    gzip_min_length 1000;

    # Логи: перенаправление вывода в stdout/stderr (для сбора Docker-ом)
    # /dev - системная папка в Linux, в которой лежат виртуальные устройства.
    # Писать данные в файлы внутри /dev - значит отправлять данные какому-то устройству или передавать их ОС.
    # Docker daemon читает эти каналы вывода и сохраняет логи оттуда на хосте, после удаления контейнера они также удаляются
    # В текущем проекте присутствует promtail, который читает логи Docker и отправляет их loki
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # HTTP/1.1 для поддержки websocket и keepalive (пул соединений Nginx с бекендом)
    proxy_http_version 1.1;

    # reverse proxy для certbot - проверка владения доменом
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Основной reverse proxy для входящих запросов
    location / {
        # Запросы прокидываются в upstream группу Django (studyoverflow)
        proxy_pass http://studyoverflow_backend;

        # Ограничение частоты запросов к Django: всплеск до 20 запросов, без задержек
        limit_req zone=requests_per_ip_django burst=20 nodelay;

        # В заголовках передается оригинальный Host из запроса клиента
        proxy_set_header Host $host;
        # В заголовках передается оригинальный IP клиента
        proxy_set_header X-Real-IP $remote_addr;
        # В заголовках передается цепочка прокси IP от самого клиента до Nginx
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # В заголовках передается протокол, по которому обратился клиент (http/https, для установления вебсокет-соединения используется сначала http)
        proxy_set_header X-Forwarded-Proto $scheme;
        # Задается пустое значение - заголовок Connection не отправляется бэкенду, иначе Nginx
        # шлет Connection: close и пул keepalive соединений Nginx с бекендом не используется.
        proxy_set_header Connection "";

        # Таймаут на подключение к бекенду Django (studyoverflow)
        # Сколько Nginx пробует установить TCP-соединение с бекендом
        proxy_connect_timeout 10s;
        # Таймаут отправки запроса бекенду
        # Сколько Nginx будет ждать ответа, если бекенд перестанет принимать пакеты
        proxy_send_timeout 300s;
        # Таймаут ожидания ответа от бекенда
        proxy_read_timeout 300s;

        # Отключена автоматическая перезапись заголовков редиректа (Location) от бэкенда
        # Не требуется, поскольку бекенд получает верный Host благодаря proxy_set_header
        proxy_redirect off;
    }

    # reverse proxy для WebSocket
    location /ws/ {
        # Запросы прокидываются в upstream группу Django (studyoverflow)
        proxy_pass http://studyoverflow_backend;

        # Поддержка WebSocket upgrade
        # В заголовках передается заголовок Upgrade (со значением "websocket" или заголовка не будет, тогда Nginx воспримет переменную как "")
        proxy_set_header Upgrade $http_upgrade;
        # В заголовках передается заголовок Connection (со значением переменной $connection_upgrade из блока map)
        proxy_set_header Connection $connection_upgrade;

        # Заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Отключена буферизация, обязательно для вебсокетов
        # Nginx передает данные моментально, а не копит их в буфере в ожидании конца ответа
        proxy_buffering off;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # Отдельная обработка favicon без бекенда ("=" из-за конкретного пути для конкретного файла)
    location = /favicon.ico {
        # Файл отдается напрямую самим Nginx
        alias /app/studyoverflow/staticfiles/img/favicon.ico;

        # Запросы к favicon не логируются
        access_log off;
        # Не логируется отсутствие файла
        log_not_found off;
    }

    # Статические файлы Django (после команды collectstatic)
    location /static/ {
        # Путь к директории, в которую собирается статика
        alias /app/studyoverflow/staticfiles/;

        # Кеширование статики у клиента, добавляет заголовок Expires
        expires 1d;
        # Установка заголовка для кеширования
        add_header Cache-Control "public, no-transform";
        # Запросы к статике не логируются
        access_log off;
    }

    # Файл robots.txt отдается как статика
    location = /robots.txt {
        # Путь к файлу из директории, в которую собирается статика
        alias /app/studyoverflow/staticfiles/robots.txt;

        # Кеш у клиента
        expires 1d;
        add_header Cache-Control "public, no-transform";

        # Запросы к файлу поисковыми ботами не логируются
        access_log off;
    }

    location /adminer/ {
        proxy_pass http://adminer:8080/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /flower/ {
        proxy_pass http://flower:5555;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}